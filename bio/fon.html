<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        html,
        body,
        .background {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050811;
        }

        .background {
            position: relative;
            contain: strict;
            background:
                radial-gradient(circle at 20% 15%, rgba(0, 114, 255, 0.2), transparent 42%),
                radial-gradient(circle at 80% 85%, rgba(0, 230, 118, 0.16), transparent 44%);
        }

        .blob {
            position: absolute;
            width: min(70vmax, 900px);
            height: min(70vmax, 900px);
            border-radius: 50%;
            opacity: 0.32;
            will-change: transform;
        }

        .blue {
            top: -38%;
            left: -22%;
            background: radial-gradient(circle, #0072ff 0%, rgba(0, 198, 255, 0.55) 38%, transparent 70%);
            animation: drift-blue 22s ease-in-out infinite alternate;
        }

        .green {
            right: -24%;
            bottom: -42%;
            background: radial-gradient(circle, #00e676 0%, rgba(29, 233, 182, 0.5) 38%, transparent 70%);
            animation: drift-green 26s ease-in-out infinite alternate;
        }

        @keyframes drift-blue {
            to { transform: translate3d(18vw, 20vh, 0) scale(1.12); }
        }

        @keyframes drift-green {
            to { transform: translate3d(-16vw, -18vh, 0) scale(1.1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="blob blue"></div>
        <div class="blob green"></div>
    </div>
</body>
</html>
