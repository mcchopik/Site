<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Сайт</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #333;
      margin: 20px 0;
    }

    .card-title {
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .game-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .game-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: #388e3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .game-details h3 {
      margin: 0;
      font-size: 18px;
    }

    .game-details p {
      margin: 4px 0 0;
      color: #888;
      font-size: 13px;
    }

    .music-toast {
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: #252525;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 1000;
      animation: slideIn 0.4s ease-out;
      max-width: 300px;
    }

    .music-toast.hidden {
      display: none;
    }

    .toast-text {
      font-size: 13px;
      line-height: 1.4;
      color: #ddd;
    }

    .toast-btn {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
    }

    .close-toast {
      background: transparent;
      border: none;
      color: #888;
      font-size: 16px;
      cursor: pointer;
      align-self: flex-start;
    }

    .close-toast:hover {
      color: #fff;
    }

    .music-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #333;
      color: #fff;
      border: 2px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s ease;
      z-index: 999;
    }

    .music-toggle-btn.playing {
      background: #4CAF50;
      border-color: #4CAF50;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
    }

    @keyframes slideIn {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title">Улюблена гра</div>
    <div class="game-info">
      <div class="game-icon">
        <i class="fa-solid fa-cube" style="color: #ffffff;"></i>
      </div>
      <div class="game-details">
        <h3>Minecraft</h3>
        <p>Sandbox / Survival</p>
      </div>
    </div>
  </div>

  <div id="musicToast" class="music-toast hidden">
    <div class="toast-content">
      <div class="toast-text">
        🔊 Хотите включить фоновую музыку? Нажмите на иконку снизу.
      </div>
      <button class="toast-btn" onclick="enableMusicFromToast()">Включить сейчас</button>
    </div>
    <button class="close-toast" onclick="closeToast()">&times;</button>
  </div>

  <button id="musicToggle" class="music-toggle-btn" onclick="toggleAudio()" title="Включить/выключить музыку">
    <i id="musicIcon" class="fas fa-music"></i>
  </button>

  <audio id="bgMusic" loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');
    const musicIcon = document.getElementById('musicIcon');
    const musicToast = document.getElementById('musicToast');

    window.addEventListener('DOMContentLoaded', () => {
      const hasVisited = localStorage.getItem('site_visited');
      const isMusicOn = localStorage.getItem('music_enabled') === 'true';

      if (!hasVisited) {
        musicToast.classList.remove('hidden');
        localStorage.setItem('site_visited', 'true');
      }

      if (isMusicOn) {
        playAudio();
      }
    });

    function toggleAudio() {
      if (audio.paused) {
        playAudio();
      } else {
        pauseAudio();
      }
    }

    function playAudio() {
      audio.play().then(() => {
        musicBtn.classList.add('playing');
        musicIcon.className = 'fas fa-volume-up';
        localStorage.setItem('music_enabled', 'true');
      }).catch(err => {});
    }

    function pauseAudio() {
      audio.pause();
      musicBtn.classList.remove('playing');
      musicIcon.className = 'fas fa-music';
      localStorage.setItem('music_enabled', 'false');
    }

    function enableMusicFromToast() {
      playAudio();
      closeToast();
    }

    function closeToast() {
      musicToast.classList.add('hidden');
    }
  </script>
</body>
</html>
