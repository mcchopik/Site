<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McChopik</title>
    <!-- Підключення окремого файлу стилів -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Підключення окремого фону -->
    <iframe id="bg-frame" src="fon.html"></iframe>

    <div class="container">
        <div class="card">
            
            <div class="card-header">
                <h1 class="profile-name">McChopik</h1>
                <div class="lang-switch">
                    <button class="lang-btn active" onclick="setLang('ua', this)">UA</button>
                    <button class="lang-btn" onclick="setLang('ru', this)">RU</button>
                    <button class="lang-btn" onclick="setLang('en', this)">EN</button>
                </div>
            </div>

            <div class="bio-list">
                <div class="bio-item">
                    <span class="bio-label" id="lbl-age">Вік</span>
                    <span class="bio-value" id="val-age">14 років</span>
                </div>
                <div class="bio-item">
                    <span class="bio-label" id="lbl-bday">День народження</span>
                    <span class="bio-value">06.04</span>
                </div>
                <div class="bio-item">
                    <span class="bio-label" id="lbl-friends">Друзі</span>
                    <span class="bio-value">6</span>
                </div>
                <div class="bio-item">
                    <span class="bio-label" id="lbl-game">Гра</span>
                    <span class="bio-value">Minecraft</span>
                </div>
                <div class="bio-item">
                    <span class="bio-label" id="lbl-langs">Мови</span>
                    <span class="bio-value" id="val-langs">UA (рідна), RU/BY</span>
                </div>
                <div class="bio-item">
                    <span class="bio-label">PP</span>
                    <span class="bio-value"><a href="https://t.me/j6nda" target="_blank">@j6nda</a></span>
                </div>
            </div>

        </div>
    </div>

    <!-- Скрипт зміни мови -->
    <script>
        const dict = {
            ua: {
                age_lbl: "Вік",
                age_val: "14 років",
                bday: "День народження",
                friends: "Друзі",
                game: "Гра",
                langs_lbl: "Мови",
                langs_val: "UA (рідна), RU/BY"
            },
            ru: {
                age_lbl: "Возраст",
                age_val: "14 лет",
                bday: "День рождения",
                friends: "Друзья",
                game: "Игра",
                langs_lbl: "Языки",
                langs_val: "UA (родной), RU/BY"
            },
            en: {
                age_lbl: "Age",
                age_val: "14 years old",
                bday: "Birthday",
                friends: "Friends",
                game: "Game",
                langs_lbl: "Languages",
                langs_val: "UA (native), RU/BY"
            }
        };

        function setLang(lang, btn) {
            document.getElementById('lbl-age').innerText = dict[lang].age_lbl;
            document.getElementById('val-age').innerText = dict[lang].age_val;
            document.getElementById('lbl-bday').innerText = dict[lang].bday;
            document.getElementById('lbl-friends').innerText = dict[lang].friends;
            document.getElementById('lbl-game').innerText = dict[lang].game;
            document.getElementById('lbl-langs').innerText = dict[lang].langs_lbl;
            document.getElementById('val-langs').innerText = dict[lang].langs_val;

            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
