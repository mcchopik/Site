<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811; /* Глибокий темний фон */
        }

        /* Контейнер з загальним ефектом лавової лампи */
        .lava-container {
            position: relative;
            width: 100%;
            height: 100%;
            filter: blur(80px); /* Сильне розмиття для м'яких градієнтів */
        }

        /* Загальні стилі для кульок */
        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.85;
            mix-blend-mode: screen;
        }

        /* Синя кулька */
        .blob-blue {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #0072ff 0%, #00c6ff 100%);
            top: 20%;
            left: 20%;
            animation: moveBlue 18s ease-in-out infinite alternate;
        }

        /* Зелена кулька */
        .blob-green {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
            bottom: 15%;
            right: 15%;
            background: radial-gradient(circle, #00e676 0%, #1de9b6 100%);
            animation: moveGreen 22s ease-in-out infinite alternate;
        }

        /* Третя додаткова кулька для плавного змішування кольорів */
        .blob-teal {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00b4db 0%, #0083b0 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: moveTeal 15s ease-in-out infinite alternate;
        }

        /* Анімації руху кульок */
        @keyframes moveBlue {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(120px, 150px) scale(1.2);
            }
            100% {
                transform: translate(-80px, 220px) scale(0.9);
            }
        }

        @keyframes moveGreen {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-140px, -120px) scale(1.25);
            }
            100% {
                transform: translate(100px, -200px) scale(0.85);
            }
        }

        @keyframes moveTeal {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
            }
            50% {
                transform: translate(-30%, -70%) scale(1.15);
            }
            100% {
                transform: translate(-70%, -30%) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="lava-container">
        <div class="blob blob-blue"></div>
        <div class="blob blob-green"></div>
        <div class="blob blob-teal"></div>
    </div>

</body>
</html>
