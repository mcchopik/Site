<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт — GriefCore</title>
    <link rel="icon" href="https://i.ibb.co/spppKJRL/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>

    <header>
        <img src="https://i.ibb.co/spppKJRL/logo.png" alt="logo" border="0" class="logo">

        <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="navMenu">
            <a href="index.html">Главная</a>
            <a href="team.html">Команда</a>
            <a href="rules.html">Правила</a>
            <a href="kontact-us.html">Контакты</a>
            <a href="play.html">Как играть</a>
            <a href="info.html">Информация</a>
            <a href="socials.html">Мы в соцсетях</a>
            <a href="donate.html">Донат</a>
            <a href="account.html" class="auth-btn current">Аккаунт</a>
        </nav>
    </header>

    <main>
        <h2 data-aos="fade-up">Аккаунт GriefCore</h2>
        <div class="info auth-wrap" data-aos="fade-up" data-aos-delay="100">
            <p class="subtitle" id="accountInfo">Загрузка...</p>
            <div class="account-actions">
                <h3>Смена пароля</h3>
                <form id="passwordForm" class="auth-form">
                    <label>Текущий пароль
                        <input type="password" name="current" required autocomplete="current-password">
                    </label>
                    <label>Новый пароль
                        <input type="password" name="password" required minlength="8" autocomplete="new-password">
                    </label>
                    <button type="submit" class="auth-submit">Изменить пароль</button>
                </form>

                <h3>Смена Email</h3>
                <form id="emailForm" class="auth-form">
                    <label>Новый Email
                        <input type="email" name="email" required autocomplete="email">
                    </label>
                    <label>Пароль
                        <input type="password" name="password" required autocomplete="current-password">
                    </label>
                    <button type="submit" class="auth-submit">Изменить Email</button>
                </form>

                <button type="button" class="link-btn" id="accountLogout">Выйти из аккаунта</button>
                <div id="accountMessage" class="auth-message" role="status"></div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/background.js"></script>
    <script src="js/main.js?v=8"></script>
</body>
</html>
