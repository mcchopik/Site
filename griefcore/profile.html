<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — GriefCore</title>
    <link rel="icon" href="https://i.ibb.co/spppKJRL/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>

    <header>
        <img src="https://i.ibb.co/spppKJRL/logo.png" alt="logo" border="0" class="logo">

        <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="navMenu">
            <a href="index.html">Главная</a>
            <a href="team.html">Команда</a>
            <a href="rules.html">Правила</a>
            <a href="kontact-us.html">Контакты</a>
            <a href="play.html">Как играть</a>
            <a href="socials.html">Мы в соцсетях</a>
            <a href="news.html">Новости</a>
            <a href="donate.html">Донат</a>
            <a href="login.html" class="auth-btn">Войти / Регистрация</a>
        </nav>
    </header>

    <main>
        <h2 data-aos="fade-up">Профиль игрока</h2>
        <div class="info auth-wrap" data-aos="fade-up" data-aos-delay="100">
            <div id="profileBox" class="profile-box">
                <p class="subtitle">Загрузка...</p>
            </div>

            <div id="profileAdmin" class="account-actions hidden">
                <h3>Управление игроком (админ)</h3>
                <form id="profileUsernameForm" class="auth-form">
                    <label>Новый логин
                        <input type="text" name="username" required minlength="3" maxlength="24" placeholder="новый_ник">
                    </label>
                    <button type="submit" class="auth-submit">Сменить логин</button>
                </form>
                <form id="profileAvatarForm" class="auth-form">
                    <label>Ссылка на аватар (https, PNG/JPG/WEBP/GIF)
                        <input type="url" name="avatar" placeholder="https://example.com/avatar.png">
                    </label>
                    <button type="submit" class="auth-submit">Сохранить аватар</button>
                </form>
                <button type="button" class="link-btn" id="profileBan" data-banned="0">Заблокировать</button>
                <button type="button" class="link-btn" id="profileDelete">Удалить аккаунт</button>
                <div id="profileAdminMessage" class="auth-message" role="status"></div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/background.js"></script>
    <script src="js/main.js?v=11"></script>
</body>
</html>
